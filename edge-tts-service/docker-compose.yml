services:
  edge-tts:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mongolate-edge-tts
    ports:
      - "127.0.0.1:8558:8000"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
